<!doctype html>
<meta charset="utf-8" />
<title>Grok Bot guide</title>
<style>
*{box-sizing:border-box;scrollbar-width:none}::-webkit-scrollbar{display:none}
:root{--accent:#FF8A00;--ink-1:rgba(255,255,255,.95);--ink-2:rgba(255,255,255,.62);--ink-3:rgba(255,255,255,.40);--line:rgba(255,255,255,.09);--fill-1:rgba(255,255,255,.06);--fill-2:rgba(255,255,255,.11);--fill-3:rgba(255,255,255,.16);--good:#34c96e;--eye:#161616;--core-ink:#0b0b0c;--edge:#0c0c0d}
html[data-theme=light]{--ink-1:rgba(0,0,0,.92);--ink-2:rgba(0,0,0,.56);--ink-3:rgba(0,0,0,.38);--line:rgba(0,0,0,.08);--fill-1:rgba(0,0,0,.045);--fill-2:rgba(0,0,0,.08);--fill-3:rgba(0,0,0,.12);--core-ink:#fff;--edge:#fff}
html,body{margin:0;background:transparent}
body{color:var(--ink-1);font:13.5px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.hd{display:flex;align-items:center;gap:10px;padding:13px 15px 6px}
.grow{flex:1;min-width:0}
.t1{font-size:16.5px;font-weight:650;letter-spacing:-.015em;line-height:1.2}
.t2{font-size:13.5px;font-weight:600;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t3{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mark{display:flex;align-items:center;gap:6px;color:var(--ink-2);font-size:11.5px;font-weight:600;letter-spacing:.01em}
.mark i{width:16px;height:16px;border-radius:5px;background:var(--ink-1);position:relative;display:inline-block}
.mark i::before,.mark i::after{content:"";position:absolute;top:5px;width:2px;height:5px;border-radius:2px;background:var(--eye);transform:rotate(12deg)}
.mark i::before{left:5.5px}.mark i::after{left:9.5px}
.crumb{position:relative;height:16px;min-width:64px;text-align:right;font-size:12px;color:var(--ink-2)}
.crumb span{position:absolute;right:0;top:0;white-space:nowrap;transition:opacity .3s,transform .4s cubic-bezier(.2,.9,.1,1)}
.crumb span:not(.on){opacity:0;transform:translateY(-6px)}

%,87.8% 24.8%,91.9% 28.7%,95.3% 33.3%,97.8% 38.5%,99.3% 43.9%,99.9% 49.6%,99.5% 55.3%,98.0% 60.8%,95.7% 66.0%,92.5% 70.6%,88.5% 74.7%,83.8% 78.0%,78.7% 80.4%,73.2% 81.9%,67.5% 82.4%,61.8% 82.4%,56.1% 82.4%,50.4% 82.4%,44.7% 82.4%,39.0% 82.4%,33.3% 82.4%,27.6% 82.0%,22.1% 80.7%,16.9% 78.4%,12.2% 75.2%,8.1% 71.3%,4.7% 66.7%,2.2% 61.5%,0.7% 56.1%,0.1% 50.4%,0.5% 44.7%,2.0% 39.2%,4.3% 34.0%,7.5% 29.4%,11.5% 25.3%,16.2% 22.0%,21.3% 19.6%,26.8% 18.1%)}.av.wedge,.shapes button.wedge{clip-path:polygon(33.8% 18.4%,37.2% 13.1%,41.4% 8.3%,46.7% 4.9%,53.0% 4.8%,58.4% 8.1%,62.6% 12.8%,66.0% 18.1%,69.2% 23.6%,72.4% 29.1%,75.6% 34.6%,78.7% 40.1%,81.9% 45.6%,85.1% 51.1%,88.2% 56.6%,91.4% 62.1%,94.6% 67.6%,97.5% 73.2%,99.5% 79.2%,99.8% 85.5%,96.7% 90.9%,91.2% 94.0%,85.0% 95.3%,78.7% 95.6%,72.4% 95.6%,66.0% 95.6%,59.7% 95.6%,53.3% 95.6%,47.0% 95.6%,40.6% 95.6%,34.3% 95.6%,28.0% 95.6%,21.6% 95.6%,15.3% 95.3%,9.1% 94.1%,3.5% 91.1%,0.3% 85.8%,0.4% 79.5%,2.4% 73.5%,5.3% 67.8%,8.4% 62.3%,11.6% 56.9%,14.8% 51.4%,18.0% 45.9%,21.1% 40.4%,24.3% 34.9%,27.5% 29.4%,30.6% 23.9%)}.av.hex,.shapes button.hex{clip-path:polygon(95.3% 67.0%,94.2% 73.2%,90.6% 78.3%,85.4% 81.9%,79.9% 85.0%,74.4% 88.2%,68.9% 91.4%,63.4% 94.5%,57.9% 97.7%,52.0% 99.8%,45.8% 99.3%,40.1% 96.6%,34.6% 93.4%,29.1% 90.2%,23.6% 87.1%,18.2% 83.9%,12.7% 80.7%,7.9% 76.7%,5.2% 71.0%,4.7% 64.7%,4.7% 58.4%,4.7% 52.0%,4.7% 45.7%,4.7% 39.4%,4.7% 33.0%,5.8% 26.8%,9.4% 21.7%,14.6% 18.1%,20.1% 15.0%,25.6% 11.8%,31.1% 8.6%,36.6% 5.5%,42.1% 2.3%,48.0% 0.2%,54.2% 0.7%,59.9% 3.4%,65.4% 6.6%,70.9% 9.8%,76.4% 12.9%,81.8% 16.1%,87.3% 19.3%,92.1% 23.3%,94.8% 29.0%,95.3% 35.3%,95.3% 41.6%,95.3% 48.0%,95.3% 54.3%,95.3% 60.6%)}.av.cloud,.shapes button.cloud{clip-path:polygon(97.8% 50.0%,100.1% 55.8%,100.7% 62.0%,99.8% 68.1%,97.3% 73.8%,93.3% 78.6%,88.3% 82.2%,82.5% 84.4%,76.3% 85.0%,70.2% 84.1%,65.1% 87.4%,59.6% 90.2%,53.6% 91.8%,47.4% 91.9%,41.3% 90.6%,35.7% 87.9%,30.5% 84.6%,24.4% 85.8%,18.2% 85.4%,12.3% 83.5%,7.1% 80.1%,2.9% 75.6%,-0.0% 70.1%,-1.5% 64.0%,-1.4% 57.8%,0.3% 51.9%,3.4% 46.5%,7.8% 42.1%,12.4% 38.3%,12.8% 32.1%,14.6% 26.2%,17.6% 20.8%,21.9% 16.2%,27.0% 12.8%,32.8% 10.6%,39.0% 9.7%,45.2% 10.3%,51.1% 12.3%,56.3% 15.6%,62.1% 15.4%,68.3% 15.1%,74.4% 16.3%,79.9% 19.1%,84.5% 23.2%,87.9% 28.4%,89.9% 34.3%,90.2% 40.5%,94.2% 45.0%)}.av.teardrop,.shapes button.teardrop{clip-path:polygon(54.9% 6.2%,50.5% 3.2%,45.7% 5.5%,42.2% 9.8%,38.7% 14.1%,35.3% 18.3%,31.8% 22.6%,28.3% 26.9%,24.9% 31.2%,21.4% 35.5%,18.0% 39.9%,15.3% 44.7%,13.3% 49.8%,12.0% 55.2%,11.5% 60.7%,11.8% 66.2%,12.9% 71.6%,14.7% 76.8%,17.3% 81.7%,20.5% 86.1%,24.3% 90.1%,28.7% 93.5%,33.5% 96.2%,38.6% 98.2%,44.0% 99.4%,49.5% 99.9%,55.0% 99.6%,60.4% 98.5%,65.6% 96.6%,70.5% 94.0%,74.9% 90.7%,78.9% 86.9%,82.2% 82.5%,84.9% 77.7%,86.9% 72.5%,88.1% 67.2%,88.5% 61.7%,88.2% 56.2%,87.0% 50.8%,85.1% 45.6%,82.5% 40.7%,79.2% 36.3%,75.8% 32.0%,72.3% 27.7%,68.8% 23.4%,65.4% 19.1%,61.9% 14.8%,58.4% 10.5%)}.av.wedge .eyes{top:18%}.av.teardrop .eyes{top:14%}
.av{transform-origin:50% 60%}
.av .eyes{position:absolute;inset:0;will-change:transform}
.av .eye{position:absolute;top:31%;width:11%;height:27%;background:var(--eye);border-radius:99px;transform:rotate(12deg);transition:transform .13s ease,height .28s cubic-bezier(.3,.9,.3,1),top .28s,width .28s,border-radius .28s}
.av .eye.l{left:38%}.av .eye.r{left:56%}
.av.blink .eye{transform:rotate(12deg) scaleY(.1)}
.av[data-state=working]{animation:bob 1.1s ease-in-out infinite}.av[data-state=working] .eye{height:21%;top:34%}
.av[data-state=thinking]{animation:tilt 3.2s ease-in-out infinite}.av[data-state=thinking] .eye.r{height:17%;top:37%}
.av[data-state=waiting]{animation:rock 2.6s ease-in-out infinite}.av[data-state=waiting] .eye{height:32%;top:28%;width:13%}
.av[data-state=done]{animation:hop .7s cubic-bezier(.3,1.4,.4,1) both}.av[data-state=done] .eye{height:13%;width:15%;top:36%;border-radius:99px 99px 12px 12px;transform:rotate(0)}
.av.ack{animation:squash .38s cubic-bezier(.3,1.5,.5,1)}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4%) rotate(-3deg)}}
@keyframes tilt{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(-8deg) translateY(-2%)}}
@keyframes rock{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-18%) scale(1.06,.94)}70%{transform:translateY(0) scale(.97,1.04)}100%{transform:none}}
@keyframes squash{0%{transform:scale(1)}40%{transform:scale(1.14,.86)}100%{transform:scale(1)}}
.stack{display:inline-flex;flex:none;align-items:center}
.stack .av{margin-left:-9px;outline:2px solid var(--edge)}
.stack .av:first-child{margin-left:0}

/* Pages: one track, slid sideways. The tallest page sets the card height. */
.view{overflow:hidden;position:relative}
.track{display:flex;align-items:flex-start;transition:transform .6s cubic-bezier(.2,.9,.1,1);will-change:transform}
.page{flex:0 0 100%;min-width:0;transition:opacity .45s,filter .45s}
.page:not(.on){opacity:.25;filter:blur(1.5px)}
.page.on .in{animation:rise .5s cubic-bezier(.2,.9,.2,1) both;animation-delay:calc(var(--i,0)*55ms + 140ms)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Hero: the VoiceOS voice core with every bot shape in orbit. */
.stage{position:relative;height:92px;margin:0 6px;overflow:hidden;border-radius:22px}
.aurora{position:absolute;inset:-30%;filter:blur(22px);opacity:.55;pointer-events:none}
.aurora i{position:absolute;width:46%;height:60%;border-radius:50%;animation:drift 11s ease-in-out infinite alternate}
.aurora i:nth-child(1){left:14%;top:22%;background:radial-gradient(closest-side,#FF6700,transparent)}
.aurora i:nth-child(2){left:44%;top:30%;background:radial-gradient(closest-side,#9159FE,transparent);animation-duration:13s;animation-delay:-4s}
.aurora i:nth-child(3){left:30%;top:10%;background:radial-gradient(closest-side,#1084FE,transparent);animation-duration:17s;animation-delay:-8s;opacity:.7}
@keyframes drift{0%{transform:translate(-12%,-6%) scale(1)}50%{transform:translate(10%,8%) scale(1.15)}100%{transform:translate(-4%,10%) scale(.95)}}
html[data-theme=light] .aurora{opacity:.3}
.orbit{position:absolute;left:50%;top:50%;width:84%;height:54px;transform:translate(-50%,-50%);border-radius:50%;border:1px dashed var(--line)}
.core{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:var(--ink-1);display:flex;align-items:center;justify-content:center;gap:3px;z-index:2;box-shadow:0 0 28px 2px rgba(255,138,0,.35)}
.core i{width:3px;height:16px;border-radius:2px;background:var(--core-ink);animation:talk 1.1s ease-in-out infinite;transform-origin:50% 50%}
.core i:nth-child(1){height:8px;animation-delay:-.2s}.core i:nth-child(2){height:14px;animation-delay:-.5s}.core i:nth-child(3){height:20px;animation-delay:-.1s}.core i:nth-child(4){height:14px;animation-delay:-.7s}.core i:nth-child(5){height:8px;animation-delay:-.35s}
@keyframes talk{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
.ring{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:1.5px solid rgba(255,138,0,.55);z-index:1;animation:ripple 2.8s cubic-bezier(.2,.7,.3,1) infinite;pointer-events:none}
.ring.r2{animation-delay:-1.4s}
@keyframes ripple{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.6);opacity:0}}
.sat{position:absolute;left:0;top:0;width:26px;height:26px;will-change:transform,opacity}
.sat .av{width:26px;height:26px}
.say{position:absolute;left:50%;bottom:calc(100% + 3px);display:flex;gap:2px;padding:3px 5px;border-radius:8px 8px 8px 2px;background:var(--ink-1);opacity:0;transform:translateX(-10%) scale(.6);transform-origin:0 100%;transition:opacity .2s,transform .3s cubic-bezier(.3,1.5,.5,1)}
.say.on{opacity:1;transform:translateX(-10%) scale(1)}
.say b{width:3px;height:3px;border-radius:50%;background:var(--core-ink);animation:dots 1s infinite}
.say b:nth-child(2){animation-delay:.15s}.say b:nth-child(3){animation-delay:.3s}
@keyframes dots{0%,60%,100%{opacity:.3}30%{opacity:1}}

.intro{text-align:center;padding:4px 24px 5px}
.intro .t3{white-space:normal;margin-top:3px}
.step{display:flex;align-items:center;gap:11px;padding:4px 15px;min-height:38px}
.num{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:650;color:var(--ink-2);background:var(--fill-2);position:relative}
.step.done .num{background:var(--good);color:#fff}
.step.done .num svg{width:13px;height:13px}
.step.done .t2{color:var(--ink-2)}
.step.next .num{background:var(--accent);color:#1a0d00}
.step.next .num::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--accent);animation:ripple 2.2s cubic-bezier(.2,.7,.3,1) infinite}
.chip{display:inline-flex;align-items:center;font-size:11px;font-weight:550;color:var(--ink-2);background:var(--fill-2);border-radius:6px;padding:1px 7px;line-height:17px;white-space:nowrap;flex:none}
.chip.go{background:rgba(255,138,0,.16);color:var(--accent)}
.chip.ok{background:rgba(52,201,110,.14);color:var(--good)}

.head2{display:flex;align-items:center;gap:12px;padding:4px 17px 6px 15px}
.parade{display:flex;align-items:flex-end;gap:5px;height:34px;flex:none}
.parade .av{width:18px;height:18px}
.parade .av:nth-child(2n){width:22px;height:22px}
.idea{display:flex;align-items:center;gap:11px;padding:4px 15px;min-height:42px;border-radius:14px;transition:background .12s}
.idea:hover{background:var(--fill-1)}
.idea .who{width:48px;display:flex;justify-content:center;flex:none}
.idea .who .av{width:28px;height:28px}
.idea .who .stack .av{width:22px;height:22px}
.idea .q{font-size:13.5px;font-weight:600;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idea .q::before{content:"\201C";color:var(--accent)}.idea .q::after{content:"\201D";color:var(--accent)}
.idea .mic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3);flex:none;transition:color .15s,background .15s}
.idea:hover .mic{color:var(--accent);background:rgba(255,138,0,.12)}
.new{width:28px;height:28px;border-radius:50%;border:1.5px dashed var(--ink-3);display:grid;place-items:center;color:var(--ink-2);font-size:16px;line-height:1}

.foot{display:flex;align-items:center;gap:8px;padding:0 15px;height:56px;padding-right:160px}
.nb{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--fill-2);color:var(--ink-1);flex:none;transition:transform .15s,background .15s,opacity .2s}
.nb:hover{background:var(--fill-3)}.nb:active{transform:scale(.9)}
.nb[disabled]{opacity:.3;pointer-events:none}
.nb.hot{background:var(--accent);color:#1a0d00;animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{0%,70%,100%{transform:translateX(0)}78%{transform:translateX(3px)}86%{transform:translateX(0)}92%{transform:translateX(2px)}}
.dots{display:flex;gap:5px;align-items:center}
.dots button{width:6px;height:6px;border-radius:99px;background:var(--fill-3);transition:width .35s cubic-bezier(.2,.9,.1,1),background .3s}
.dots button.on{width:18px;background:var(--ink-1)}
.hint{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</div></div>
<div class="foot"><button class="nb" id="prev" aria-label="Back"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><span class="dots" id="dots"><button aria-label="Setup"></button><button aria-label="Things to say"></button></span><button class="nb" id="next" aria-label="Next"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button><span class="hint" id="hint"></span></div>

<script>
const DEMO=__VOICEOS_DEMO__;

const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const EYES='<span class="eyes"><i class="eye l"></i><i class="eye r"></i></span>';
const av=(b,st)=>'<span class="av '+esc(b.shape||'blob')+'" data-state="'+esc(st||b.status||'idle')+'" style="--c:'+esc(b.color)+'">'+EYES+'</span>';
let inited=false;
addEventListener('message',e=>{const m=e.data;if(!m||m.type!=='voiceos:init')return;if(inited)return;inited=true;boot(m.data||DEMO.data,m.args||DEMO.args,(m.theme&&m.theme.mode)||'dark');});
setTimeout(()=>{if(!inited){inited=true;boot(DEMO.data,DEMO.args,'dark')}},350);
function boot(data,args,mode){document.documentElement.dataset.theme=mode;render(data||{},args||{});report();new ResizeObserver(report).observe(document.body);}
function report(){if(document.hidden||!document.documentElement.offsetWidth)return;const h=Math.ceil(document.body.getBoundingClientRect().height);if(h>=8)parent.postMessage({type:'voiceos:resize',height:h},'*')}

/* Motion — the widgets' avatar liveness engine: wandering gaze, blinks, cursor-follow, per-state behavior. */
const Motion=(()=>{
 const R=(a,b)=>a+Math.random()*(b-a);
 const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
 let pointer=null,ptrAt=0;
 addEventListener('pointermove',e=>{pointer={x:e.clientX,y:e.clientY};ptrAt=performance.now()});
 document.documentElement.addEventListener('pointerleave',()=>pointer=null);
 const live=new Set();
 const st=m=>m.el.dataset.state||'idle';
 function later(m,fn,ms){const t=setTimeout(()=>{m.timers.delete(t);fn()},ms);m.timers.add(t)}
 function clear(m){m.timers.forEach(clearTimeout);m.timers.clear()}
 function gaze(m,x,y,dur){if(pointer)return;m.eyes.style.transition='transform '+dur+'ms cubic-bezier(.3,.7,.2,1)';m.eyes.style.transform='translate('+x+'%,'+y+'%)'}
 function blink(m,dbl){if(reduce)return;m.el.classList.add('blink');later(m,()=>{m.el.classList.remove('blink');if(dbl)later(m,()=>blink(m),170)},120)}
 function schedule(m){clear(m);const s=st(m);
  const bl=()=>{blink(m,Math.random()<.2);later(m,bl,R(s==='working'?1600:2600,s==='working'?3200:5800))};later(m,bl,R(300,2400));
  const gz=()=>{
   if(s==='idle'){gaze(m,R(-14,14),R(-8,8),R(500,900));later(m,()=>gaze(m,0,0,800),R(900,2400))}
   else if(s==='working'){gaze(m,R(-16,-8),R(4,10),130);later(m,()=>gaze(m,R(8,16),R(4,10),130),R(220,420))}
   else if(s==='thinking'){gaze(m,Math.random()<.75?14:-14,-12,600)}
   else if(s==='waiting'){gaze(m,0,-3,500)}
   else gaze(m,0,0,300);
   later(m,gz,s==='working'?R(600,1200):s==='idle'?R(2400,6000):R(1600,3200))};
  gz();
  if(s==='done')later(m,()=>set(m.el,m.el.dataset.rest||'idle'),2200);
 }
 function mount(el){if(el._m||!el.querySelector('.eyes'))return;const m=el._m={el,eyes:el.querySelector('.eyes'),timers:new Set()};live.add(m);schedule(m)}
 function scan(){document.querySelectorAll('.av').forEach(mount);live.forEach(m=>{if(!m.el.isConnected){clear(m);live.delete(m);delete m.el._m}})}
 function tick(){if(pointer&&!reduce){if(performance.now()-ptrAt>4000)pointer=null;else live.forEach(m=>{if(!m.el.isConnected||!m.el.offsetParent)return;const r=m.el.getBoundingClientRect();const dx=pointer.x-(r.left+r.width/2),dy=pointer.y-(r.top+r.height/2);const d=Math.hypot(dx,dy)||1,k=Math.min(1,d/140);m.eyes.style.transition='transform 200ms cubic-bezier(.2,.8,.2,1)';m.eyes.style.transform='translate('+(dx/d*16*k).toFixed(1)+'%,'+(dy/d*10*k).toFixed(1)+'%)'})}requestAnimationFrame(tick)}
 requestAnimationFrame(tick);
 new MutationObserver(scan).observe(document.documentElement,{childList:true,subtree:true});
 function set(el,s){if(!el)return;el.dataset.state=s;if(el._m)schedule(el._m)}
 function react(el){if(!el)return;el.classList.remove('ack');void el.offsetWidth;el.classList.add('ack');if(el._m)blink(el._m)}
 return{scan,set,react,reduce};
})();

/* Every shape Grok lets you pick, each in its own palette color and mood. */
const CREW=[
 {shape:'blob',color:'#FF6700',status:'working'},{shape:'pebble',color:'#9159FE',status:'idle'},
 {shape:'squircle',color:'#1084FE',status:'thinking'},{shape:'tablet',color:'#00C972',status:'idle'},
 {shape:'wedge',color:'#FF309B',status:'waiting'},{shape:'hex',color:'#00BCA6',status:'working'},
 {shape:'cloud',color:'#FF9800',status:'idle'},{shape:'teardrop',color:'#FF263C',status:'thinking'},
];
const SAMPLE=[{name:'Pepper',color:'#FF6700',shape:'blob'},{name:'Scout',color:'#1084FE',shape:'hex'},{name:'Nova',color:'#9159FE',shape:'cloud'}];
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const MIC='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';

/* ── Hero orbit ── */
const Orbit=(()=>{
 let sats=[],running=false,t=0,last=0,chatter=0,w=0,h=0;
 function mount(stage){
  stage.insertAdjacentHTML('beforeend',CREW.map(b=>'<span class="sat">'+av(b)+'<span class="say"><b></b><b></b><b></b></span></span>').join(''));
  sats=$$('.sat',stage).map((el,i)=>({el,av:el.firstChild,say:el.querySelector('.say'),a:i/CREW.length*Math.PI*2}));
  sats.forEach(s=>s.av.dataset.rest=s.av.dataset.state);
  const measure=()=>{w=stage.clientWidth;h=stage.clientHeight;place(t)};measure();new ResizeObserver(measure).observe(stage);
 }
 function place(t){if(!w)return;
  const cx=w/2,cy=h/2,rx=w*.42,ry=27;
  for(const s of sats){const a=s.a+t*.00022;const z=Math.sin(a),f=(z+1)/2;
   const x=cx+rx*Math.cos(a)-13,y=cy+ry*z-13;
   s.el.style.transform='translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px) scale('+(.7+.42*f).toFixed(3)+')';
   s.el.style.opacity=(.45+.55*f).toFixed(2);s.el.style.zIndex=z>0?3:1;s.front=z>.35}
 }
 function frame(now){if(!running)return;t+=Math.min(50,now-last);last=now;place(t);
  if(now>chatter){chatter=now+1700+Math.random()*1200;const front=sats.filter(s=>s.front);const s=front[Math.random()*front.length|0];
   if(s){if(Math.random()<.5){s.say.classList.add('on');setTimeout(()=>s.say.classList.remove('on'),1500)}else Motion.set(s.av,'done')}}
  requestAnimationFrame(frame)}
 function play(on){if(Motion.reduce||on===running)return;running=on;if(on){last=performance.now();requestAnimationFrame(frame)}}
 return{mount,play};
})();

/* ── Page 1: setup steps, checked against this Mac ── */
function renderSteps(d){
 const s=d.setup||{};const bots=Array.isArray(d.bots)?d.bots:[];
 const botCount=typeof s.bots==='number'?s.bots:null;
 const steps=[
  {t:'Get the Grok Bot app',sub:'Install it on this Mac, then open it.',done:s.app===true},
  {t:'Sign in to Grok Bot',sub:'VoiceOS uses that session. No keys to paste.',done:s.signedIn===true},
  {t:'Make your first bot',sub:botCount?('You have '+botCount+' bot'+(botCount===1?'':'s')+'.'):'Say “Create a bot named Scout”.',done:!!botCount,team:bots},
  {t:'Get pings from bots',sub:'Turn on “Show notifications from bots”.',done:s.notifications===true,opt:true},
 ];
 const next=steps.findIndex(x=>!x.done&&!x.opt);
 const req=steps.filter(x=>!x.opt),doneReq=req.filter(x=>x.done).length;
 $('#intro-sub').textContent=next<0?'You’re all set. Swipe for things to say.':doneReq?doneReq+' of '+req.length+' steps done. Then just talk.':'Three quick steps, then just talk.';
 $('#steps').innerHTML=steps.map((x,i)=>{
  const cls=x.done?'done':i===next?'next':'';
  const right=x.done&&x.team&&x.team.length?'<span class="stack">'+x.team.slice(0,3).map(b=>av(b,'idle')).join('')+'</span>'
   :x.done?'<span class="chip ok">Done</span>':i===next?'<span class="chip go">Next</span>':x.opt?'<span class="chip">Optional</span>':'';
  return '<div class="step in '+cls+'" style="--i:'+(i+2)+'"><span class="num">'+(x.done?CHECK:i+1)+'</span><div class="grow"><div class="t2">'+esc(x.t)+'</div><div class="t3">'+esc(x.sub)+'</div></div>'+right+'</div>';
 }).join('');
 $$('#steps .stack .av').forEach(a=>{a.style.width=a.style.height='20px'});
}

/* ── Page 2: things to say, voiced with the user's own bots when there are some ── */
function renderIdeas(d){
 const own=(Array.isArray(d.bots)?d.bots:[]).filter(b=>b&&b.name).slice(0,3);
 const cast=[0,1,2].map(i=>own[i]||SAMPLE.filter(x=>!own.some(o=>o.name===x.name))[i-own.length]||SAMPLE[i]);
 const n=i=>cast[i].name;
 const ideas=[
  {q:'Show my bots',sub:'See everyone and what they’re up to',who:'<span class="stack">'+cast.map(b=>av(b,'idle')).join('')+'</span>'},
  {q:'Ask '+n(0)+' to summarize today',sub:'Give a task. It opens ready to send.',who:av(cast[0],'working')},
  {q:'Show me '+n(1)+'’s screen',sub:'Watch it work, live',who:av(cast[1],'working')},
  {q:'What did '+n(2)+' find?',sub:'Catch up without opening anything',who:av(cast[2],'thinking')},
  {q:'Start a group with '+n(0)+' and '+n(1),sub:'Put a team on one job',who:'<span class="stack">'+av(cast[0],'waiting')+av(cast[1],'waiting')+'</span>'},
  {q:'Create a bot named Juno',sub:'Hire a new teammate',who:'<span class="new" id="juno">+</span>'},
 ];
 $('#ideas').innerHTML=ideas.map((x,i)=>'<div class="idea in" style="--i:'+(i+1)+'"><span class="who">'+x.who+'</span><div class="grow"><div class="q">'+esc(x.q)+'</div><div class="t3">'+esc(x.sub)+'</div></div><span class="mic">'+MIC+'</span></div>').join('');
 $('#parade').innerHTML=CREW.slice(0,5).map((b,i)=>av(b,i%2?'working':'idle')).join('');
}
/* The "+" becomes a brand-new bot that hops in, then goes back to waiting its turn. */
let junoTimer=0;
function hireJuno(on){clearInterval(junoTimer);const slot=$('#juno');if(!slot||!on)return;
 const hire=()=>{const s=$('#juno');if(!s)return;s.outerHTML='<span id="juno">'+av({shape:'teardrop',color:'#00C972'},'done')+'</span>';
  setTimeout(()=>{const j=$('#juno');if(j&&page===1)j.outerHTML='<span class="new" id="juno">+</span>'},2600)};
 setTimeout(hire,900);junoTimer=setInterval(hire,4200);}

/* ── Paging: arrows, dots, keys, swipe ── */
let page=0;
const HINTS=['Things to say','Back to setup'];
function go(p){
 page=Math.max(0,Math.min(1,p));
 $('#track').style.transform='translateX('+(-100*page)+'%)';
 $$('.page').forEach((el,i)=>{el.classList.toggle('on',i===page);el.inert=i!==page});
 $$('#dots button').forEach((b,i)=>b.classList.toggle('on',i===page));
 $$('.crumb span').forEach((s,i)=>s.classList.toggle('on',i===page));
 $('#prev').disabled=page===0;$('#next').disabled=page===1;
 $('#next').classList.toggle('hot',page===0);
 $('#hint').textContent=HINTS[page];
 Orbit.play(page===0&&!document.hidden);
 hireJuno(page===1);
}
function wire(){
 $('#prev').onclick=()=>go(page-1);$('#next').onclick=()=>go(page+1);
 $$('#dots button').forEach((b,i)=>b.onclick=()=>go(i));
 addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(page+1);if(e.key==='ArrowLeft')go(page-1)});
 let wx=0,wt=0;addEventListener('wheel',e=>{if(Math.abs(e.deltaX)<=Math.abs(e.deltaY))return;const now=performance.now();if(now-wt<500)return;wx+=e.deltaX;if(Math.abs(wx)>40){go(page+(wx>0?1:-1));wx=0;wt=now}},{passive:true});
 let px=null;const view=$('.view');
 view.addEventListener('pointerdown',e=>{px=e.clientX});
 addEventListener('pointerup',e=>{if(px===null)return;const dx=e.clientX-px;px=null;if(Math.abs(dx)>50)go(page+(dx<0?1:-1))});
 document.addEventListener('visibilitychange',()=>Orbit.play(page===0&&!document.hidden));
}

function render(d,args){
 renderSteps(d);renderIdeas(d);Orbit.mount($('#stage'));wire();
 go(args.page===1||args.page==='ideas'?1:0);
}
</script>
