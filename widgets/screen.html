.av{transform-origin:50% 60%}
.av .eyes{position:absolute;inset:0;will-change:transform}
.av .eye{position:absolute;top:31%;width:11%;height:27%;background:var(--eye);border-radius:99px;transform:rotate(12deg);transition:transform .13s ease,height .28s cubic-bezier(.3,.9,.3,1),top .28s,width .28s,border-radius .28s}
.av .eye.l{left:38%}.av .eye.r{left:56%}
.av.blink .eye{transform:rotate(12deg) scaleY(.1)}
.av[data-state=working]{animation:bob 1.1s ease-in-out infinite}.av[data-state=working] .eye{height:21%;top:34%}
.av[data-state=thinking]{animation:tilt 3.2s ease-in-out infinite}.av[data-state=thinking] .eye.r{height:17%;top:37%}
.av[data-state=waiting]{animation:rock 2.6s ease-in-out infinite}.av[data-state=waiting] .eye{height:32%;top:28%;width:13%}
.av[data-state=blocked]{animation:shake 3.2s ease-in-out infinite}.av[data-state=blocked] .eye{height:8%;top:41%;transform:rotate(0)}
.av[data-state=done]{animation:hop .7s cubic-bezier(.3,1.4,.4,1) both}.av[data-state=done] .eye{height:13%;width:15%;top:36%;border-radius:99px 99px 12px 12px;transform:rotate(0)}
.av.ack{animation:squash .38s cubic-bezier(.3,1.5,.5,1)}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4%) rotate(-3deg)}}
@keyframes tilt{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(-8deg) translateY(-2%)}}
@keyframes rock{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes shake{0%,10%,100%{transform:translateX(0)}2%{transform:translateX(-6%)}4%{transform:translateX(6%)}6%{transform:translateX(-4%)}8%{transform:translateX(3%)}}
@keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-18%) scale(1.06,.94)}70%{transform:translateY(0) scale(.97,1.04)}100%{transform:none}}
@keyframes squash{0%{transform:scale(1)}40%{transform:scale(1.14,.86)}100%{transform:scale(1)}}
.dot.warn{background:var(--accent)}.dot.bad{background:var(--bad)}
.av.small{width:24px;height:24px}.av.tiny{width:18px;height:18px}
.chip{display:inline-flex;align-items:center;font-size:11px;font-weight:500;color:var(--ink-2);background:var(--fill-2);border-radius:6px;padding:1px 6px;line-height:16px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.on{background:var(--good);box-shadow:0 0 0 0 rgba(52,201,110,.6);animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,201,110,.55)}100%{box-shadow:0 0 0 6px rgba(52,201,110,0)}}
.lbl{font-size:11px;font-weight:600;color:var(--ink-2);letter-spacing:.02em;text-transform:uppercase;margin:0 0 5px 2px}
.confirm-pad{height:48px}
.foot{display:flex;align-items:center;gap:6px;padding:0 15px;height:56px;color:var(--ink-3);font-size:11.5px;padding-right:160px}
.bubble{max-width:82%;padding:8px 12px;border-radius:16px;font-size:13.5px;line-height:1.38;word-wrap:break-word}
.bubble.bot{background:var(--fill-2);border-bottom-left-radius:6px;align-self:flex-start}
.bubble.me{background:var(--fill-3);border-bottom-right-radius:6px;align-self:flex-end}
.bubble b{font-weight:650}
.sys{align-self:center;color:var(--ink-3);font-size:11.5px;display:flex;align-items:center;gap:5px;padding:2px 0}
.msgs{display:flex;flex-direction:column;gap:6px;padding:4px 14px 8px;overflow-y:auto}
.compose{display:flex;align-items:center;gap:8px;margin:4px 12px 12px;background:var(--fill-1);border:1px solid var(--line);border-radius:22px;padding:5px 5px 5px 6px}
.compose input{background:none;border:0;padding:6px 4px;flex:1;min-width:0}
.compose .plus{width:30px;height:30px;border-radius:50%;background:var(--fill-2);color:var(--ink-2);font-size:18px;line-height:30px;text-align:center;flex:none}
.compose .send{width:30px;height:30px;border-radius:50%;background:var(--ink-1);color:#000;flex:none;display:grid;place-items:center;transition:transform .12s,opacity .15s}
.compose .send:active{transform:scale(.92)}
.compose .send[disabled]{opacity:.35}
.row{display:flex;align-items:center;gap:11px;padding:8px 15px;transition:background .12s;width:100%;text-align:left;border-radius:14px}
.row:hover{background:var(--fill-1)}
.row:active{background:var(--fill-2)}

.fade-in{animation:in .28s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>.ty{display:inline-flex;gap:3px;padding:3px 0}.ty i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);animation:ty 1s infinite}.ty i:nth-child(2){animation-delay:.15s}.ty i:nth-child(3){animation-delay:.3s}@keyframes ty{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}</style>

<style>
/* Caption inside the frame (avatar · "Name's screen" · tag), brand mark top-right; the header row is gone so the frame can be wider. */
.screen{position:relative;margin:10px 6px 0;border-radius:16px;overflow:hidden;aspect-ratio:16/10;cursor:pointer;padding:5px;background:linear-gradient(180deg,#2c2c31 0%,#15151a 45%,#0a0a0c 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.04),0 22px 44px -18px rgba(0,0,0,.75),0 0 70px -24px var(--glow,rgba(255,138,0,.5));transition:transform .5s cubic-bezier(.2,.8,.2,1),box-shadow .5s}
/* --hs = +4px a side (set in report); must stay under the 6px margin, body clips */
.screen:hover{transform:translateY(-1px) scale(var(--hs,1.01));box-shadow:inset 0 1px 0 rgba(255,255,255,.26),inset 0 -1px 0 rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.04),0 28px 54px -18px rgba(0,0,0,.8),0 0 90px -22px var(--glow,rgba(255,138,0,.6))}
html[data-theme=light] .screen{background:linear-gradient(180deg,#f2f2f5,#c9c9cf 50%,#9a9aa2);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(0,0,0,.25),0 22px 44px -18px rgba(0,0,0,.35),0 0 70px -24px var(--glow,rgba(255,138,0,.4))}
.screen:active{transform:scale(.995);transition-duration:.12s}
.screen::after{content:"";position:absolute;inset:5px;border-radius:11px;pointer-events:none;z-index:2;background:linear-gradient(115deg,rgba(255,255,255,.09) 0%,rgba(255,255,255,.03) 28%,transparent 42%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),inset 0 0 40px rgba(0,0,0,.25)}
.screen canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.feed{position:absolute;inset:5px;border-radius:11px;overflow:hidden;background:#0a0a0b;transition:opacity .4s}
.feed.stale{opacity:.5}
.cap{position:absolute;left:5px;right:5px;bottom:5px;z-index:4;padding:26px 8px 8px 12px;border-radius:0 0 11px 11px;background:linear-gradient(transparent,rgba(0,0,0,.72));display:flex;align-items:center;gap:10px;color:#fff;pointer-events:none}
.cap .ctl{display:flex;gap:2px;flex:none;pointer-events:auto}
.cap .tb{height:26px;padding:0 9px;color:rgba(255,255,255,.82)}.cap .tb:hover{background:rgba(255,255,255,.14);color:#fff}.cap .tb.bad{color:#ff8080}
.cap .grow{flex:1;min-width:0}
.cap .who{font-size:14px;font-weight:650;letter-spacing:-.01em;display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden}
.cap .who .chip{background:rgba(255,255,255,.18);color:#fff}
.cap .what.cmd{white-space:normal;word-break:break-all;font:10.5px/1.3 ui-monospace,Menlo,monospace}
.cap .what{font-size:12px;color:rgba(255,255,255,.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.cap .av{width:26px;height:26px;outline:2px solid rgba(255,255,255,.25)}
#brand{position:absolute;top:14px;right:14px;z-index:4;height:20px;padding:0 5px;border-radius:10px;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);gap:0}
/* noVNC mounts its own <div class="_screen"(flex)><canvas margin:auto> inside .rfb. With scaleViewport
   OFF the canvas keeps its native framebuffer resolution; we force it to fill .rfb and object-fit:cover
   scales the bitmap to cover the frame — no letterbox bars (scaleViewport's fit-inside caused those,
   the _screen flex background showing around the shrunk canvas). !important beats noVNC's inline sizing. */
.rfb{position:absolute;inset:0;pointer-events:none;background:#0a0a0b}
.rfb canvas{position:static!important;inset:auto;margin:0!important;width:100%!important;height:100%!important;object-fit:cover!important}
.cur{position:absolute;width:13px;height:18px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));transition:left .55s cubic-bezier(.3,.7,.2,1),top .55s cubic-bezier(.3,.7,.2,1);z-index:3;pointer-events:none}
.cur svg{width:100%;height:100%}
.cur .ring{position:absolute;left:-9px;top:-9px;width:30px;height:30px;border-radius:50%;border:1.5px solid #fff;opacity:0;transform:scale(.4)}
.cur.click .ring{animation:ring .5s ease-out}
@keyframes ring{0%{opacity:.8;transform:scale(.4)}100%{opacity:0;transform:scale(1.2)}}
.live{position:absolute;top:14px;left:14px;z-index:4;display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px 0 7px;border-radius:10px;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);color:#fff;font-size:10px;font-weight:700;letter-spacing:.06em}
.live .rec{width:5px;height:5px;border-radius:50%;background:var(--bad);animation:rec 1.2s ease-in-out infinite}
@keyframes rec{50%{opacity:.35}}
.live.paused .rec{background:rgba(255,255,255,.4);animation:none}
.hear{display:flex;align-items:center;gap:10px;margin:12px 16px 14px;color:var(--ink-2);font-size:12.5px}
.hear .wv{display:flex;gap:2px;align-items:center;height:14px;flex:none}
.hear .wv i{display:block;width:3px;height:14px;border-radius:2px;background:var(--accent);animation:wave 1s ease-in-out infinite}
.hear .wv i:nth-child(2){animation-delay:.15s}.hear .wv i:nth-child(3){animation-delay:.3s}.hear .wv i:nth-child(4){animation-delay:.45s}
@keyframes wave{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.tb{height:28px;padding:0 10px;border-radius:14px;font-size:12px;font-weight:600;color:var(--ink-2);transition:background .15s,color .15s}
.tb:hover{background:var(--fill-1);color:var(--ink-1)}
.tb.bad{color:var(--bad)}
.tb[disabled]{opacity:.35;pointer-events:none}
.sp{display:inline-block;width:9px;height:9px;border:1.5px solid var(--ink-3);border-right-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<div class="screen" id="screen" role="button" aria-label="Open in Grok Bot">
  <div class="feed" id="feed"><canvas id="cv" width="800" height="500"></canvas></div>
  <span class="mark" id="brand"><i></i></span>
  <div class="cap"><span id="capav"></span><div class="grow"><div class="who" id="who"></div><div class="what" id="what"></div></div><span class="ctl"><button class="tb" id="pause">Pause</button><button class="tb bad" id="stop">Stop</button></span></div>
  <div class="cur" id="cur" style="left:44%;top:42%"><span class="ring"></span><svg viewBox="0 0 14 20"><path d="M1 1l12 9-5 1 3 6-2.5 1.2L5.6 12 1 15z" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/></svg></div>
  <div class="live" id="live"><i class="rec"></i>LIVE</div>
</div>
<div class="hear"><span class="wv"><i></i><i></i><i></i><i></i></span><span>Say “take over” to open on your Mac</span></div>
<script>
const DEMO=__VOICEOS_DEMO__;
/* gzip+base64 noVNC RFB client, injected by cards.ts only when there is a live stream (empty otherwise). */
const RFB_B64='__VOICEOS_RFB__';

const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const EYES='<span class="eyes"><i class="eye l"></i><i class="eye r"></i></span>';
const av=(b,cls='')=>'<span class="av '+(b.shape||'blob')+' '+cls+'" data-state="'+esc(b.status||'idle')+'" style="--c:'+esc(b.color)+'">'+EYES+'</span>';
let inited=false,CAN_INVOKE=false;
addEventListener('message',e=>{const m=e.data;if(!m||m.type!=='voiceos:init')return;inited=true;if(e.source===parent&&m.capabilities)CAN_INVOKE=!!m.capabilities.invokeTool;boot(m.data||DEMO.data,m.args||DEMO.args,(m.theme&&m.theme.mode)||'dark');});
setTimeout(()=>{if(!inited)boot(DEMO.data,DEMO.args,'dark')},350);
function boot(data,args,mode){document.documentElement.dataset.theme=mode;render(data||{},args||{});hydrate(args||{});report();new ResizeObserver(report).observe(document.body);}
function getVal(el){return 'value' in el&&el.tagName!=='BUTTON'?el.value:(el.dataset.value??'')}
function setVal(el,v){if('value' in el&&el.tagName!=='BUTTON')el.value=v??'';else{el.dataset.value=v;el.dispatchEvent(new CustomEvent('hydrate',{detail:v}))}}
function hydrate(args){$$('[data-voiceos-key]').forEach(el=>{const k=el.dataset.voiceosKey;if(k in args)setVal(el,args[k]);el.addEventListener('input',()=>stage(k,getVal(el)))})}
function stage(key,value){parent.postMessage({type:'voiceos:updateInput',key,value},'*')}
function report(){if(document.hidden||!document.documentElement.offsetWidth)return;const sc=$('#screen');sc.style.setProperty('--hs',1+8/sc.offsetWidth);const h=Math.ceil(document.body.getBoundingClientRect().height);if(h>=8)parent.postMessage({type:'voiceos:resize',height:h},'*')}

/* Motion — an original avatar liveness engine: wandering gaze, blinks, cursor-follow, per-state behavior. */
const Motion=(()=>{
 const R=(a,b)=>a+Math.random()*(b-a);
 const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
 let pointer=null,ptrAt=0;
 addEventListener('pointermove',e=>{pointer={x:e.clientX,y:e.clientY};ptrAt=performance.now()});
 document.documentElement.addEventListener('pointerleave',()=>pointer=null);
 const live=new Set();
 const st=m=>m.el.dataset.state||'idle';
 function later(m,fn,ms){const t=setTimeout(()=>{m.timers.delete(t);fn()},ms);m.timers.add(t)}
 function clear(m){m.timers.forEach(clearTimeout);m.timers.clear()}
 function gaze(m,x,y,dur){if(pointer)return;m.eyes.style.transition='transform '+dur+'ms cubic-bezier(.3,.7,.2,1)';m.eyes.style.transform='translate('+x+'%,'+y+'%)'}
 function blink(m,dbl){if(reduce)return;m.el.classList.add('blink');later(m,()=>{m.el.classList.remove('blink');if(dbl)later(m,()=>blink(m),170)},120)}
 function schedule(m){clear(m);const s=st(m);
  const bl=()=>{blink(m,Math.random()<.2);later(m,bl,R(s==='working'?1600:2600,s==='working'?3200:5800))};later(m,bl,R(300,2400));
  const gz=()=>{
   if(s==='idle'){gaze(m,R(-14,14),R(-8,8),R(500,900));later(m,()=>gaze(m,0,0,800),R(900,2400))}
   else if(s==='working'){gaze(m,R(-16,-8),R(4,10),130);later(m,()=>gaze(m,R(8,16),R(4,10),130),R(220,420))}
   else if(s==='thinking'){gaze(m,Math.random()<.75?14:-14,-12,600)}
   else if(s==='waiting'){gaze(m,0,-3,500)}
   else if(s==='blocked'){gaze(m,0,12,500)}
   else gaze(m,0,0,300);
   later(m,gz,s==='working'?R(600,1200):s==='idle'?R(2400,6000):R(1600,3200))};
  gz();
  if(s==='done')later(m,()=>set(m.el,'idle'),2200);
 }
 function mount(el){if(el._m||!el.querySelector('.eyes'))return;const m=el._m={el,eyes:el.querySelector('.eyes'),timers:new Set()};live.add(m);schedule(m)}
 function scan(){document.querySelectorAll('.av').forEach(mount);live.forEach(m=>{if(!m.el.isConnected){clear(m);live.delete(m);delete m.el._m}})}
 function tick(){if(pointer&&!reduce){if(performance.now()-ptrAt>4000)pointer=null;else live.forEach(m=>{if(!m.el.isConnected)return;const r=m.el.getBoundingClientRect();const dx=pointer.x-(r.left+r.width/2),dy=pointer.y-(r.top+r.height/2);const d=Math.hypot(dx,dy)||1,k=Math.min(1,d/140);m.eyes.style.transition='transform 200ms cubic-bezier(.2,.8,.2,1)';m.eyes.style.transform='translate('+(dx/d*16*k).toFixed(1)+'%,'+(dy/d*10*k).toFixed(1)+'%)'})}requestAnimationFrame(tick)}
 requestAnimationFrame(tick);
 new MutationObserver(scan).observe(document.documentElement,{childList:true,subtree:true});
 function set(el,s){if(!el)return;el.dataset.state=s;if(el._m)schedule(el._m)}
 function react(el){if(!el)return;el.classList.remove('ack');void el.offsetWidth;el.classList.add('ack');if(el._m)blink(el._m)}
 return{scan,set,react};
})();

const botById=(d,id)=>(d.bots||[]).find(b=>b.id===id)||{name:id,color:'#888',shape:'blob'};

/* ---- Screen feed: args.stream is the bot computer's websockify socket. ---- */
const Feed=(()=>{
 const cv=$('#cv');let paused=false,connected=false;
 /* Live path. `url` is the bot computer's websockify WebSocket (wss://…/websockify?token=…&network_token=…).
    The viewer (noVNC RFB) ships INSIDE this card as gzip+base64 (RFB_B64, built by scripts/build-rfb.ts):
    the pod's own vnc.html can't be iframed (its relative asset loads carry no token → 404) and the
    pod sends no CORS headers (so no fetch/import from it). Only the WebSocket works from in here. */
 let rfb=null,lastUrl='',rfbMod=null,retries=0;
 function loadRFB(){return rfbMod||(rfbMod=(async()=>{
  const bin=Uint8Array.from(atob(RFB_B64),c=>c.charCodeAt(0));
  const inflated=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).blob();
  const mod=await import(URL.createObjectURL(new Blob([inflated],{type:'text/javascript'})));
  return mod.default;})());}
 function badge(label,off){const l=$('#live');l.classList.toggle('paused',!!off);l.lastChild.textContent=label}
 /* The host may boot the card twice (350ms fallback, then the real voiceos:init). A repeat connect
    to the same socket is a no-op; a different url swaps sockets without the old one's disconnect
    event touching the badge — otherwise the card flashes ENDED before it shows LIVE. */
 function connect(url){if(!url||!RFB_B64)return;if(rfb&&lastUrl===url)return;connected=true;lastUrl=url;cv.style.display='none';
  const f=$('#feed');let box=f.querySelector('.rfb');if(!box){box=document.createElement('div');box.className='rfb';f.appendChild(box)}
  loadRFB().then(RFB=>{
   if(rfb&&lastUrl===url)return;
   if(rfb){const old=rfb;rfb=null;old._stale=true;try{old.disconnect()}catch(e){}}
   /* scaleViewport OFF (not resizeSession — noVNC blocks remote resize on a viewOnly socket): noVNC then
      renders the canvas at full framebuffer resolution and CSS object-fit:cover scales it to fill the
      frame edge-to-edge. scaleViewport ON would fit-inside and letterbox black bars around the canvas. */
   const r=rfb=new RFB(box,url,{shared:true});r.viewOnly=true;r.scaleViewport=false;r.background='#0a0a0b';
   /* Match the frame to the remote screen's real shape so it fills with no bars AND no crop. The pod
      framebuffer (e.g. 1280x800 = 16:10) rarely matches the card's default AR; read the canvas's intrinsic
      size once it's up and set the frame's aspect-ratio to it, then re-report height so the card grows.
      object-fit:cover stays as the safety net for the gap before this runs or an odd resolution. */
   let fitTries=0;const fitFrame=()=>{const cvn=box.querySelector('canvas');if(cvn&&cvn.width>1&&cvn.height>1){$('#screen').style.aspectRatio=cvn.width+'/'+cvn.height;report();return}if(fitTries++<40)setTimeout(fitFrame,100)};
   r.addEventListener('connect',()=>{if(!r._stale){badge('LIVE',false);fitFrame()}});
   r.addEventListener('disconnect',e=>{if(r._stale)return;rfb=null;const clean=e.detail&&e.detail.clean;badge(clean?'ENDED':'OFFLINE',true);
    /* The pod drops sockets now and then; a few quick retries turn a blip into a hiccup instead of a dead card. */
    if(!clean&&!paused&&retries<4){retries++;setTimeout(()=>{if(!rfb&&!paused&&lastUrl)connect(lastUrl)},1500*retries)}});
   r.addEventListener('connect',()=>{retries=0});
   rfb.addEventListener('credentialsrequired',()=>{badge('LOCKED',true);$('#what').textContent='This screen needs a password'});
  }).catch(err=>{badge('OFFLINE',true);$('#what').textContent='Viewer failed: '+((err&&err.message)||err)});
 }
 function pause(p){paused=p;$('#feed').classList.toggle('stale',p);if(!connected)return;
  if(p&&rfb){const r=rfb;rfb=null;r._stale=true;try{r.disconnect()}catch(e){}badge('PAUSED',true)}
  else if(!p&&!rfb&&lastUrl)connect(lastUrl)}
 return{pause,connect}
})();

let D,B,paused=false,isLive=false,openReq='';
/* Print the command the click ran. The host answers invokeTool with voiceos:toolResult; interim
   statuses (confirmation_required…) are skipped, and the MCP-shaped result is unpacked. */
addEventListener('message',e=>{const m=e.data;if(e.source!==parent||!m||m.type!=='voiceos:toolResult'||m.requestId!==openReq)return;
 if(!['completed','failed','cancelled','unknown'].includes(m.status))return;
 let o={};try{const r=m.result||{};o=r.structuredContent||JSON.parse(r.content[0].text)}catch(_){}
 const w=$('#what');w.style.display='';w.classList.add('cmd');w.textContent=m.status==='completed'&&o.command?'$ '+o.command:'Open failed: '+(o.error||m.error||m.status)});
function render(d,a){D=d;B=botById(d,a.bot||'pepper');
 $('#capav').innerHTML=av({...B,status:'working'},'');$('#screen').style.setProperty('--glow',B.color+'80');
 $('#who').innerHTML=esc(B.name)+'’s screen'+(B.label?' <span class="chip">'+esc(B.label)+'</span>':'');
 $('#pause').onclick=e=>{e.stopPropagation();paused=!paused;Feed.pause(paused);$('#live').classList.toggle('paused',paused);$('#live').lastChild.textContent=paused?'PAUSED':'LIVE';$('#pause').textContent=paused?'Resume':'Pause'};
 $('#stop').onclick=e=>{e.stopPropagation();Feed.pause(true);$('#live').classList.add('paused');$('#live').lastChild.textContent='STOPPED';$('#what').textContent='Stopped by you';Motion.set($('#capav .av'),'blocked');$('#stop').disabled=true;$('#pause').disabled=true};
 /* openUrl is https-only, so the server opens the grokbot:// link (see cards.ts screenCard). */
 $('#screen').onclick=()=>{if(CAN_INVOKE)parent.postMessage({type:'voiceos:invokeTool',name:'grokbot_open_screen',args:{bot:B.id},requestId:openReq='o'+Date.now()},'*')};
 if(a.stream){goLive(a)}else{goIdle()}
}
/* Real feed: the bot's own desktop over its websockify socket. No demo cursor, no scripted steps.
   The header's action line stays empty: the gateway has no "current action", and the bot's last chat
   message (the only text we have) read as if it were one. */
function goLive(a){isLive=true;Feed.connect(a.stream);
 $('#cur').style.display='none';
 $('#what').textContent='';$('#what').style.display='none';
 Motion.set($('#capav .av'),B.status==='idle'?'idle':'working');
}
/* No stream: the bot's computer is not running. Dark screen, IDLE badge, controls off. */
function goIdle(){isLive=false;Feed.pause(true);
 $('#cur').style.display='none';$('#cv').style.display='none';$('#feed').classList.remove('stale');
 $('#live').classList.add('paused');$('#live').lastChild.textContent='IDLE';
 $('#what').textContent=B.name+'’s computer is off right now';
 Motion.set($('#capav .av'),'idle');$('#pause').disabled=true;$('#stop').disabled=true;
}
</script>
