<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect Grok Bot to VoiceOS</title>
<style>
  * { box-sizing: border-box }
  :root { color-scheme: dark; --ink: #f5f5f5; --secondary: #b0b0b5; --bg: #101010; --button: #f3f3f5; --button-ink: #171719 }
  [data-theme="light"] { color-scheme: light; --ink: #19191b; --secondary: #55555a; --bg: #fafafa; --button: #202024; --button-ink: white }
  body { margin: 0; padding: 16px; color: var(--ink); background: var(--bg); font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif }
  header { display: flex; align-items: center; gap: 10px }
  .mark .voiceos-mk { display: block; width: 32px; height: 32px; border-radius: 8px }
  h1 { margin: 0; font-size: 17px; line-height: 1.25; letter-spacing: -.02em }
  p { margin: 10px 0 0; color: var(--secondary); overflow-wrap: anywhere }
  button { display: block; margin-top: 12px; max-width: 100%; min-height: 34px; padding: 6px 15px; border: 0; border-radius: 20px; background: var(--button); color: var(--button-ink); font: inherit; font-weight: 600; cursor: pointer }
  button:focus-visible { outline: 2px solid #66adff; outline-offset: 2px }
  button:disabled { opacity: .65; cursor: wait }
  [hidden], p:empty { display: none }
</style>
<header><span class="mark" aria-hidden="true"><i></i></span><h1>Grok Bot</h1></header>
<p id="description">Connect your account to read and send bot messages from the notch.</p>
<button type="button" id="browser-login" hidden>Sign in to Grok Bot</button>
<p role="status" aria-live="polite" id="status"></p>
<script>
  const DEMO=__VOICEOS_DEMO__;
  const button = document.getElementById("browser-login");
  const status = document.getElementById("status");
  const description = document.getElementById("description");
  let pendingRequest;
  function render(data) {
    button.hidden = !data.browserLogin;
    description.textContent = data.browserLogin
      ? "Connect your account to read and send bot messages from the notch."
      : "Sign in to the Grok Bot app, then say “show my bots”.";
  }
  render(DEMO.data);
  button.addEventListener("click", () => {
    if (pendingRequest) return;
    pendingRequest = "browser-login-" + Date.now();
    button.disabled = true;
    status.textContent = "Opening your browser…";
    parent.postMessage({ type: "voiceos:invokeTool", name: "grokbot_reconnect", args: {}, requestId: pendingRequest }, "*");
  });
  addEventListener("message", event => {
    if (event.source !== parent) return;
    const message = event.data;
    if (message?.type === "voiceos:init") {
      document.documentElement.dataset.theme = message.theme?.mode || "dark";
      render({ ...DEMO.data, ...message.data });
      return;
    }
    if (!pendingRequest || message?.type !== "voiceos:toolResult" || message.requestId !== pendingRequest) return;
    if (!["completed", "failed", "denied", "cancelled", "unknown"].includes(message.status)) return;
    pendingRequest = undefined;
    button.disabled = false;
    const result = message.result;
    const text = result?.content?.find(block => block.type === "text")?.text;
    let body = result?.structuredContent ?? result;
    if (text && !result.structuredContent) {
      try { body = JSON.parse(text); } catch { body = undefined; }
    }
    status.textContent = message.status === "completed" && !result?.isError && body?.ok === true
      ? "Finish signing in in your browser, then say “show my bots”."
      : "Sign-in didn’t start. Try again.";
  });
  new ResizeObserver(() => {
    const height = Math.ceil(document.body.getBoundingClientRect().height);
    if (height > 0) parent.postMessage({ type: "voiceos:resize", height }, "*");
  }).observe(document.body);
</script>
</html>
