<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'; worker-src 'none'; img-src data:; style-src 'nonce-__VOICEOS_NONCE__'; script-src 'nonce-__VOICEOS_NONCE__'; connect-src __VOICEOS_CSP_CONNECT__">
  <title>Computer viewer</title>
  <style nonce="__VOICEOS_NONCE__">
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      background: #050506;
      color: rgba(255, 255, 255, .94);
    }
    * { box-sizing: border-box; }
    html, body, main, #viewport { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: radial-gradient(circle at 50% 38%, #171719 0, #09090a 52%, #050506 100%); }
    #viewport { display: grid; place-items: center; }
    .chrome {
      position: fixed;
      inset: 18px 18px auto 84px;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      pointer-events: none;
    }
    .live {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      border: 1px solid rgba(255, 255, 255, .13);
      background: rgba(18, 18, 20, .74);
      box-shadow: 0 8px 30px rgba(0, 0, 0, .32);
      backdrop-filter: blur(18px) saturate(130%);
      -webkit-backdrop-filter: blur(18px) saturate(130%);
    }
    .live {
      gap: 7px;
      padding: 0 12px 0 11px;
      border-radius: 999px;
      color: rgba(255, 255, 255, .82);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .08em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .live .rec { width: 6px; height: 6px; flex: none; border-radius: 50%; background: rgba(255, 255, 255, .42); }
    .live[data-state="connected"] .rec { background: #45d37e; animation: rec 1.2s ease-in-out infinite; }
    .live[data-state="error"] .rec { background: #ff6464; }
    @keyframes rec { 50% { opacity: .35; } }
    #message {
      position: fixed;
      z-index: 4;
      left: 50%;
      bottom: 28px;
      width: min(520px, calc(100vw - 48px));
      transform: translateX(-50%);
      padding: 12px 16px;
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: 12px;
      background: rgba(18, 18, 20, .82);
      box-shadow: 0 16px 50px rgba(0, 0, 0, .42);
      color: rgba(255, 255, 255, .72);
      font-size: 13px;
      line-height: 1.4;
      text-align: center;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      transition: opacity .18s ease;
      pointer-events: none;
    }
    #message[hidden] { display: block; opacity: 0; }
    @media (prefers-reduced-motion: reduce) { #message { transition: none; } }
  </style>
</head>
<body>
  <main aria-label="Remote computer">
    <div id="viewport"></div>
    <div class="chrome">
      <div class="live" id="live" data-state="connecting" role="status" aria-live="polite">
        <i class="rec" aria-hidden="true"></i>
        <span id="livetext">Connecting</span>
      </div>
    </div>
    <div id="message" role="status" aria-live="polite">Connecting to the computer…</div>
  </main>
  <script type="module" nonce="__VOICEOS_NONCE__">
    console.debug = console.info = console.warn = console.error = () => {};
    // The noVNC client bundle, gzip-inflated on the host and injected here. It
    // uses top-level await, so it MUST run as a module; keeping the boot code in
    // this SAME module means it runs only after that await settles — with no
    // blob: URL import, which WKWebView blocks for an opaque-origin (baseURL nil)
    // document. The injected bundle ends by defining VoiceOSRFB in this scope.
    __VOICEOS_RFB_SOURCE__

    (() => {
      "use strict";
      const config = window.__VOICEOS_CONFIG__;
      delete window.__VOICEOS_CONFIG__;
      const viewport = document.getElementById("viewport");
      const live = document.getElementById("live");
      const liveText = document.getElementById("livetext");
      const message = document.getElementById("message");
      let rfb = null;
      let retryTimer = 0;
      let retries = 0;
      let clearing = false;

      const botName = config && typeof config.botName === "string" ? config.botName : "";
      const setState = (kind, label, detail = "") => {
        live.dataset.state = kind;
        liveText.textContent = (botName ? botName + " " : "") + label;
        message.textContent = detail;
        message.hidden = !detail;
      };

      const clearCredential = () => {
        clearing = true;
        clearTimeout(retryTimer);
        if (rfb) {
          const current = rfb;
          rfb = null;
          try { current.disconnect(); } catch {}
        }
        if (config) config.wsUrl = "";
      };
      window.__voiceosClearCredential = clearCredential;
      addEventListener("pagehide", clearCredential, { once: true });
      addEventListener("contextmenu", event => event.preventDefault());
      // Forward a local paste (⌘V) into the remote session's clipboard so the
      // human can paste text they copied on their Mac straight onto the VM.
      addEventListener("paste", event => {
        if (!rfb || clearing) return;
        const text = event.clipboardData && event.clipboardData.getData("text");
        if (text) { try { rfb.clipboardPasteFrom(text); } catch {} }
      });

      if (!config || typeof config.wsUrl !== "string" || typeof config.botName !== "string" || typeof VoiceOSRFB !== "function") {
        setState("error", "Unavailable", "The viewer could not start. Close this window and try again.");
        return;
      }

      const connect = () => {
        if (clearing || !config.wsUrl) return;
        setState("connecting", retries ? "Reconnecting" : "Connecting", retries ? "The stream dropped. Reconnecting…" : "Connecting to the computer…");
        try {
          const current = rfb = new VoiceOSRFB(viewport, config.wsUrl, { shared: true });
          current.viewOnly = false;
          current.focusOnClick = true;
          current.scaleViewport = true;
          current.resizeSession = false;
          current.background = "#050506";
          current.addEventListener("connect", () => {
            if (current !== rfb) return;
            retries = 0;
            setState("connected", "Live");
          });
          current.addEventListener("disconnect", () => {
            if (current !== rfb || clearing) return;
            rfb = null;
            retries += 1;
            if (retries <= 5) {
              setState("disconnected", "Reconnecting", "The stream dropped. Reconnecting…");
              retryTimer = setTimeout(connect, Math.min(6000, retries * 1200));
            } else {
              setState("error", "Idle", "This session ended. Close the window and reopen it for a fresh connection.");
            }
          });
          current.addEventListener("credentialsrequired", () => {
            clearCredential();
            setState("error", "Idle", "This session ended. Close the window and reopen it for a fresh connection.");
          });
          current.addEventListener("securityfailure", () => {
            clearCredential();
            setState("error", "Idle", "The secure viewer could not connect. Close the window and try again.");
          });
        } catch {
          setState("error", "Idle", "The viewer could not start. Close this window and try again.");
        }
      };

      connect();
    })();
  </script>
</body>
</html>
